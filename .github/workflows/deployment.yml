name: Fast Deployment Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main

jobs:
  Deployment:
    runs-on: [self-hosted, windows, x64]

    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup Node with Cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Install Dependencies Fast
      - name: Install Dependencies
        run: npm ci

      # SonarQube Scan
      - name: SonarQube Scan
        continue-on-error: true
        shell: powershell
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          sonar-scanner `
            "-Dsonar.projectKey=minishopapp" `
            "-Dsonar.sources=src" `
            "-Dsonar.host.url=$env:SONAR_HOST_URL" `
            "-Dsonar.token=$env:SONAR_TOKEN" `
            "-Dsonar.qualitygate.wait=false"

      # OWASP Dependency Check Cache
      - name: Cache OWASP Data
        uses: actions/cache@v4
        with:
          path: C:\dependency-check\data
          key: dependency-check-${{ runner.os }}

      # OWASP Scan
      - name: OWASP Dependency Check
        continue-on-error: true
        shell: powershell
        run: |
          C:\dependency-check\bin\dependency-check.bat `
            --project "minishopapp" `
            --scan "." `
            --format "HTML" `
            --out "reports" `
            --data "C:\dependency-check\data" `
            --disableYarnAudit `
            --noupdate `
            --failOnCVSS 11

      # Upload Report
      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        with:
          name: OWASP-Report
          path: reports

      # Build React App
      - name: Build App
        run: npm run build

      # Docker Login
      - name: Docker Login
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # Enable Docker Build Cache
      - name: Build Docker Image
        run: |
          docker build `
            --cache-from dineshvit11/minishopapp:latest `
            -t dineshvit11/minishopapp:latest .

      # Push Image
      - name: Push Docker Image
        run: |
          docker push dineshvit11/minishopapp:latest

      # Remove Old Container
      - name: Remove Old Container
        continue-on-error: true
        shell: powershell
        run: |
          docker stop minishopapp
          docker rm minishopapp

      # Run Container
      - name: Run Docker Container
        run: |
          docker run -d -p 3000:80 --name minishopapp dineshvit11/minishopapp:latest